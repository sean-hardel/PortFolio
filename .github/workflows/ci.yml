name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  quality:
    name: Lighthouse & CV
    runs-on: ubuntu-latest
    env:
      # Site servi à la racine pour Lighthouse et le script du CV
      PAGES_BASE_PATH: ""
      BASE_PATH: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: CV sur une page
        run: |
          npx playwright install --with-deps chromium
          npm run cv:pdf

      - name: Lighthouse
        run: npx @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/reports
